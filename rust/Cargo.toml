[package]
name = "dicom-test-files"
version = "0.4.0"
authors = ["Rob Young <rob@robyoung.digital>", "Eduardo Pinho <enet4mikeenet@gmail.com>"]
edition = "2021"
description = "A collection of DICOM files for testing DICOM implementations."
repository = "https://github.com/robyoung/dicom-test-files"
license-file = "../LICENSE.txt"
keywords = ["DICOM", "medical", "image", "dataset"]
categories = ["development-tools::testing", "parsing"]
readme = "../README.md"

[features]
default = ["zstd"]
zstd = ["dep:zstd"]

[dependencies]
ureq = "3.0"
sha2 = "0.11"
tempfile = "3.3.0"
digest-io = "0.1.0"
base16ct = "1.0.0"

[dependencies.zstd]
version = "0.14"
default-features = false
optional = true
